# Controlled real-web acquisition smoke set (Step 5B.1)
#
# WHAT THIS IS, AND WHAT IT IS NOT
# ===============================
# Twelve physical pages from the client's real source list, chosen to cover the
# technical cases the acquisition stack has only ever seen as fixtures. It exists so
# the first contact with real university infrastructure is *twelve deliberate
# requests* rather than 319, and so that run is reproducible rather than a one-off
# someone did by hand.
#
# It is **not** business configuration. Nothing reads it at runtime, no scheduler
# consults it, and it confers nothing on the sources it names -- they are exactly as
# publication-ineligible as the other 307. Deleting this file would change no
# behaviour beyond the smoke command.
#
# SELECTION RULES
# ===============
# * one page per institution, so twelve requests hit twelve hosts and no university
#   sees a burst;
# * every core source category represented once;
# * all six destinations represented (US, GB, AU, HK, CA, SG);
# * the two structurally unusual URLs named explicitly -- UBC's query-addressed
#   calendar and Caltech's direct PDF;
# * one `UNCLASSIFIED` page, because "fetchable without a category" is a claim Step 5B
#   makes and should be tested against a real server;
# * no URL appears twice, so no duplicate responsibility claim is fetched twice.
#
# `source_ref` is submission-local and only meaningful inside the current import;
# `url` is the stable identity and what the loader matches on. If a re-import changes
# the refs, the URLs still resolve.

version = "2026-09-19"
expected_pages = 12

[[page]]
ref = "S0001"
institution = "Imperial College London"
destination = "GB"
category = "UNIVERSITY_HOME"
url = "https://www.imperial.ac.uk/"

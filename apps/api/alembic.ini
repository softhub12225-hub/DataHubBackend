[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os

# Timestamped, ordered, readable filenames. Alembic's default random-hex-only names
# make a migration directory impossible to read in commit order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# No sqlalchemy.url here by design: the DSN is assembled from the same typed
# settings the application uses (see alembic/env.py). A URL in this file is a
# committed credential waiting to happen.

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Alembic's own logging is configured programmatically in env.py so that migration
# output matches the application's structured format.
[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
